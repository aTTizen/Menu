<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta
        name="description"
        content="Carta digital de La Cabra Mareada: hamburguesas, cervezas, papas, pizzas y panchos.">
    <meta name="theme-color" content="#fff8eb">

    <title>La Cabra Mareada | Menú</title>

    <link rel="stylesheet" href="css/style.css?v=4">
</head>

<body class="pagina-portada">

    <main class="contenedor-portada">

        <img
            src="img/portada.jpeg"
            alt="Menú principal de La Cabra Mareada"
            class="portada"
            width="1050"
            height="1485"
            fetchpriority="high">

        <nav class="enlaces-portada" aria-label="Categorías de la carta">

            <a
                class="zona zona-burgers"
                href="hamburguesas.html"
                aria-label="Ver carta de hamburguesas">
                <span class="texto-accesible">Hamburguesas</span>
                <span class="indicador" aria-hidden="true">→</span>
            </a>

            <a
                class="zona zona-cervezas"
                href="cervezas.html"
                aria-label="Ver carta de cervezas">
                <span class="texto-accesible">Cervezas</span>
                <span class="indicador" aria-hidden="true">→</span>
            </a>

            <a
                class="zona zona-papas"
                href="papas.html"
                aria-label="Ver carta de papas">
                <span class="texto-accesible">Papas</span>
                <span class="indicador" aria-hidden="true">→</span>
            </a>

            <a
                class="zona zona-pizzas"
                href="pizzas.html"
                aria-label="Ver carta de pizzas">
                <span class="texto-accesible">Pizzas</span>
                <span class="indicador" aria-hidden="true">→</span>
            </a>

            <a
                class="zona zona-panchos"
                href="pizzas.html#panchos"
                aria-label="Ver la sección de panchos">
                <span class="texto-accesible">Panchos</span>
                <span class="indicador" aria-hidden="true">→</span>
            </a>

        </nav>

    </main>

</body>

</html>
